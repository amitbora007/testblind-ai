# ==============================================================================
# TestBlind AI — Render Blueprint Infrastructure as Code (render.yaml)
# ==============================================================================
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: testblind-postgres
    databaseName: testblind_db
    user: testblind_user
    plan: free
    region: oregon
    ipAllowList: [] # Allows connections from all Render services in your account

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service (FastAPI + Python 3.12 + AsyncPG)
  # ----------------------------------------------------------------------------
  - type: web
    name: testblind-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateCrypto: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: testblind-postgres
          property: connectionString
      - key: MAX_CONCURRENT_WORKERS
        value: "2"
      - key: MAX_TENANT_CONCURRENT_RUNS
        value: "2"
      - key: EXECUTION_MAX_MEMORY_MB
        value: "512"
      - key: EXECUTION_MAX_OUTPUT_BYTES
        value: "1048576"
      - key: SANDBOX_BASE_DIR
        value: /tmp/testblind_sandboxes
      - key: FRONTEND_URL
        value: https://testblind-web.onrender.com
      - key: BACKEND_CORS_ORIGINS
        value: https://testblind-web.onrender.com,http://localhost:3000
      - key: DEFAULT_LLM_PROVIDER
        value: local
      - key: DEFAULT_LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Single-Page Application (React 18 + Vite + TypeScript)
  # ----------------------------------------------------------------------------
  - type: web
    name: testblind-web
    runtime: static
    rootDir: frontend
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        value: https://testblind-api.onrender.com
